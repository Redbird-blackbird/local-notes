<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Local Notes - Minimalist Notion-style Markdown Vault for Obsidian and local files">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Local Notes">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232383e2'><path d='M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z'/></svg>"/>

  <title>Local Notes</title>
  <link rel="manifest" href="manifest.json">

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #FFFFFF;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      color: #37352F;
      font-family: 'Inter', sans-serif;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    .loading-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(55, 53, 47, 0.1);
      border-top-color: #2383E2;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <script>
    // File System Access API bridge for Local Notes
    window.localNotesFS = {
      isSupported: function() {
        return typeof window.showDirectoryPicker === 'function';
      },
      currentDirHandle: null,
      pickDirectory: function(callback) {
        if (!window.showDirectoryPicker) {
          if (callback) callback(JSON.stringify({ success: false, error: "File System Access API is not supported in this browser." }));
          return;
        }
        window.showDirectoryPicker({ mode: 'readwrite' }).then(async function(dirHandle) {
          window.localNotesFS.currentDirHandle = dirHandle;
          const files = [];

          async function scanDir(handle, currentPath) {
            for await (const entry of handle.values()) {
              if (entry.name.startsWith('.')) continue;
              const relPath = currentPath ? (currentPath + '/' + entry.name) : entry.name;
              if (entry.kind === 'file') {
                if (entry.name.endsWith('.md') || entry.name.endsWith('.markdown') || entry.name.endsWith('.txt')) {
                  try {
                    const file = await entry.getFile();
                    const text = await file.text();
                    files.push({
                      name: entry.name,
                      path: relPath,
                      content: text,
                      lastModified: file.lastModified
                    });
                  } catch (e) {
                    console.warn("Could not read file:", entry.name, e);
                  }
                }
              } else if (entry.kind === 'directory') {
                if (entry.name !== 'node_modules' && !entry.name.startsWith('.')) {
                  await scanDir(entry, relPath);
                }
              }
            }
          }

          await scanDir(dirHandle, '');
          const result = JSON.stringify({
            success: true,
            vaultName: dirHandle.name,
            files: files
          });
          if (callback) callback(result);
        }).catch(function(err) {
          if (err.name === 'AbortError') {
            if (callback) callback(JSON.stringify({ success: false, aborted: true }));
          } else {
            if (callback) callback(JSON.stringify({ success: false, error: err.message }));
          }
        });
      },
      saveFile: function(filePath, content, callback) {
        if (!window.localNotesFS.currentDirHandle) {
          if (callback) callback(JSON.stringify({ success: false, error: "No directory handle active" }));
          return;
        }
        (async function() {
          try {
            const parts = filePath.split('/');
            let currentHandle = window.localNotesFS.currentDirHandle;
            for (let i = 0; i < parts.length - 1; i++) {
              currentHandle = await currentHandle.getDirectoryHandle(parts[i], { create: true });
            }
            const fileHandle = await currentHandle.getFileHandle(parts[parts.length - 1], { create: true });
            const writable = await fileHandle.createWritable();
            await writable.write(content);
            await writable.close();
            if (callback) callback(JSON.stringify({ success: true }));
          } catch (err) {
            console.error("Save error:", err);
            if (callback) callback(JSON.stringify({ success: false, error: err.message }));
          }
        })();
      },
      deleteFile: function(filePath, callback) {
        if (!window.localNotesFS.currentDirHandle) {
          if (callback) callback(JSON.stringify({ success: false, error: "No directory handle active" }));
          return;
        }
        (async function() {
          try {
            const parts = filePath.split('/');
            let currentHandle = window.localNotesFS.currentDirHandle;
            for (let i = 0; i < parts.length - 1; i++) {
              currentHandle = await currentHandle.getDirectoryHandle(parts[i]);
            }
            await currentHandle.removeEntry(parts[parts.length - 1]);
            if (callback) callback(JSON.stringify({ success: true }));
          } catch (err) {
            if (callback) callback(JSON.stringify({ success: false, error: err.message }));
          }
        })();
      },
      downloadFile: function(filename, content) {
        const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }
    };
  </script>
</head>
<body>
  <div id="loading">
    <div class="loading-spinner"></div>
    <div style="font-weight: 500; font-size: 14px; letter-spacing: -0.01em;">Loading Local Notes...</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('load', function() {
      setTimeout(function() {
        const loader = document.getElementById('loading');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => loader.remove(), 300);
        }
      }, 800);
    });
  </script>
</body>
</html>
